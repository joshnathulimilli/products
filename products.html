<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Shopsy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-auth="required">
<header>
    <nav class="navbar" aria-label="Main navigation">
        <h2>Shopsy</h2>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="index.html" id="logoutLink">Logout</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="products" aria-labelledby="productsTitle">
        <h1 id="productsTitle">Our Products</h1>

        <article class="card">
            <img src="images/watch.jpg" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>Rs. 1999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/headphones.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Rs. 1499</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/laptop.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>Rs. 49999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/tablet.jpg" alt="Tablet">
            <h3>Tablet</h3>
            <p>Rs. 9999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/camera.jpg" alt="Camera">
            <h3>Camera</h3>
            <p>Rs. 24999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>
    </section>
</main>

<footer>
    <p>&copy; 2026 Shopsy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
