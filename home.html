<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Shopsy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav class="navbar" aria-label="Main navigation">
        <h2>Shopsy</h2>
        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="index.html" id="logoutLink">Logout</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero" aria-labelledby="homeTitle">
        <h1 id="homeTitle">Welcome to Shopsy</h1>
        <p>Best deals on electronics, gadgets, and everyday tech.</p>
        <a href="products.html" class="hero-btn">Shop Products</a>
    </section>

    <section class="products" aria-labelledby="featuredTitle">
        <h2 id="featuredTitle">Featured Products</h2>

        <article class="card">
            <img src="images/watch.jpg" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>Rs. 1999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/headphones.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Rs. 1499</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>

        <article class="card">
            <img src="images/laptop.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>Rs. 49999</p>
            <button type="button" class="cart-btn">Add to Cart</button>
        </article>
    </section>
</main>

<footer>
    <p>&copy; 2026 Shopsy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
